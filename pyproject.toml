[project]
name = "drohnenprojekt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stefan Nguyen", email = "stefan16.nguyen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pymavlink>=2.4.50",
    "torch>=2.14.1",
    "ultralytics>=8.4.177",
    "torch",
    "torchvision",
]

[project.scripts]
drohnenprojekt = "drohnenprojekt:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]

